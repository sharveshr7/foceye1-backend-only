services:
  - type: web
    name: foceye1-backend-only
    env: docker
    dockerfilePath: Dockerfile
    region: oregon
    plan: standard
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        value: '["https://foceye.vercel.app","https://foceye-frontend.vercel.app","https://foceye1-backend-only.onrender.com"]'
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
